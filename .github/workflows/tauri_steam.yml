name: Tauri Steam Builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            platform: windows
          - name: Linux x86_64
            os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        working-directory: tauri
        run: npm install

      - name: Build Windows executable
        if: matrix.platform == 'windows'
        working-directory: tauri
        run: npm run tauri -- build --no-bundle

      - name: Package Windows depot
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tauri/dist/windows | Out-Null
          Copy-Item "tauri/src-tauri/target/release/adventure-land.exe" "tauri/dist/windows/Adventure Land.exe"
          Copy-Item "tauri/src-tauri/binaries/steam_api64.dll" "tauri/dist/windows/steam_api64.dll"
          tar -czf tauri/dist/adventure-land-windows-x86_64.tar.gz -C tauri/dist/windows .

      - name: Build Linux executable
        if: matrix.platform == 'linux'
        working-directory: tauri
        run: npm run tauri -- build --no-bundle

      - name: Package Linux depot
        if: matrix.platform == 'linux'
        run: |
          mkdir -p tauri/dist/linux
          cp "tauri/src-tauri/target/release/adventure-land" "tauri/dist/linux/Adventure Land"
          cp tauri/src-tauri/binaries/libsteam_api.so tauri/dist/linux/libsteam_api.so
          chmod 755 "tauri/dist/linux/Adventure Land"
          strip --strip-unneeded "tauri/dist/linux/Adventure Land"
          patchelf --set-rpath '$ORIGIN' "tauri/dist/linux/Adventure Land"
          ldd "tauri/dist/linux/Adventure Land" | grep -F 'libsteam_api.so'
          tar -czf tauri/dist/adventure-land-linux-x86_64.tar.gz -C tauri/dist/linux .

      - uses: actions/upload-artifact@v4
        with:
          name: steam-${{ matrix.platform }}-x86_64
          path: tauri/dist/adventure-land-${{ matrix.platform }}-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
