name: Tauri Steam Builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x86_64
            os: windows-latest
            platform: windows
          - name: Linux x86_64
            os: ubuntu-22.04
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install Tauri CLI
        working-directory: tauri
        run: npm install

      - name: Build Windows executable
        if: matrix.platform == 'windows'
        working-directory: tauri
        run: npm run tauri -- build --no-bundle

      - name: Package Windows depot
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tauri/dist/windows | Out-Null
          Copy-Item "tauri/src-tauri/target/release/adventure-land.exe" "tauri/dist/windows/Adventure Land.exe"
          Copy-Item "tauri/src-tauri/binaries/steam_api64.dll" "tauri/dist/windows/steam_api64.dll"
          tar -czf tauri/dist/adventure-land-windows-x86_64.tar.gz -C tauri/dist/windows .

      - name: Build self-contained Linux bundle
        if: matrix.platform == 'linux'
        working-directory: tauri
        run: LD_LIBRARY_PATH="$PWD/src-tauri/binaries${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" npm run tauri -- build --bundles appimage

      - name: Package Linux depot
        if: matrix.platform == 'linux'
        run: |
          mkdir -p tauri/dist/linux
          appimage="$(find tauri/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          chmod 755 "$appimage"
          cd tauri/dist/linux
          "$OLDPWD/$appimage" --appimage-extract
          mv squashfs-root runtime
          rm -f \
            runtime/usr/lib/libwayland-client.so* \
            runtime/usr/lib/libwayland-cursor.so* \
            runtime/usr/lib/libwayland-egl.so* \
            runtime/usr/lib/libwayland-server.so*
          cp "$OLDPWD/tauri/src-tauri/target/release/adventure-land" adventure-land-native
          cp "$OLDPWD/tauri/src-tauri/binaries/libsteam_api.so" libsteam_api.so
          cp "$OLDPWD/tauri/linux/Adventure Land" "Adventure Land"
          chmod 755 "Adventure Land" adventure-land-native
          strip --strip-unneeded adventure-land-native
          patchelf --set-rpath '$ORIGIN' adventure-land-native
          ldd adventure-land-native | grep -F 'libsteam_api.so'
          test -x runtime/AppRun
          test -z "$(find runtime/usr/lib -maxdepth 1 \( -type f -o -type l \) \( \
            -name 'libwayland-*.so*' \
          \) -print -quit)"
          find runtime -name 'libglib-2.0.so*' -print -quit | grep -q .
          find runtime -name 'libwebkit2gtk-4.1.so*' -print -quit | grep -q .
          find runtime -name 'WebKitNetworkProcess' -print -quit | grep -q .
          find runtime -name 'libsteam_api.so' -print -quit | grep -q .
          bundle_library_path="$PWD/runtime/usr/lib:$PWD/runtime/usr/lib/x86_64-linux-gnu"
          for bundled_library in \
            runtime/usr/lib/libpango-1.0.so.0 \
            runtime/usr/lib/libjavascriptcoregtk-4.1.so.0 \
            runtime/usr/lib/libwebkit2gtk-4.1.so.0; do
            resolution="$(LD_LIBRARY_PATH="$bundle_library_path" ldd -r "$bundled_library" 2>&1)"
            printf '%s\n' "$resolution"
            ! printf '%s\n' "$resolution" | grep -E 'not found|undefined symbol'
          done
          cd ../../..
          tar -czf tauri/dist/adventure-land-linux-x86_64.tar.gz -C tauri/dist/linux .

      - uses: actions/upload-artifact@v4
        with:
          name: steam-${{ matrix.platform }}-x86_64
          path: tauri/dist/adventure-land-${{ matrix.platform }}-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 7
