<p><span class='dlabel'>change_server(region, name)</span></p>
<p>Navigates the current character to another Adventure Land server.</p>
<p><b>Returns:</b> Nothing; the page begins navigating immediately.</p>
<p><b>Notes:</b> Unsaved runtime state is lost during navigation. Save persistent state first when needed.</p>
<p><b>Example:</b></p>
<div class='code'>change_server("EU", "I");</div>
