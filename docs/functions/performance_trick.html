<p><span class='dlabel'>performance_trick()</span></p>
<p>Plays an empty sound so supporting browsers are less likely to throttle background JavaScript.</p>
<p><b>Returns:</b> Nothing.</p>
<p><b>Notes:</b> Browser behavior varies. Desktop clients do not need this compatibility helper.</p>
<p><b>Example:</b></p>
<div class='code'>performance_trick();</div>
