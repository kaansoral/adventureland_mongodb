<p><span class='dlabel'>get_characters()</span></p>
<p>Returns the account's cached character summaries.</p>
<p><b>Returns:</b> Array. The cache is updated less frequently than the live character object.</p>
<p><b>Example:</b></p>
<div class='code'>show_json(get_characters());</div>
