<p><span class='dlabel'>on_party_invite(name)</span></p>
<p>Override point called with the inviter's name when a party invitation arrives.</p>
<p><b>Returns:</b> Return value is ignored.</p>
<p><b>Example:</b></p>
<div class='code'>function on_party_invite(name) {
	accept_party_invite(name);
}</div>
