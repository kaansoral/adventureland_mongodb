<p><span class='dlabel'>is_disabled(entity)</span></p>
<p>Checks whether an entity cannot act because it is dead, stunned, or otherwise disabled by the shared runtime rules.</p>
<p><b>Returns:</b> Boolean.</p>
<p><b>Example:</b></p>
<div class='code'>if (!is_disabled(character)) attack(target);</div>
