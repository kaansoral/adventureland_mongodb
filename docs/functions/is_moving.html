<p><span class='dlabel'>is_moving(entity)</span></p>
<p>Checks ordinary movement and the local smart_move state for an entity.</p>
<p><b>Returns:</b> Boolean.</p>
<p><b>Example:</b></p>
<div class='code'>if (!is_moving(character)) smart_move("goo");</div>
