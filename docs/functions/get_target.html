<p><span class='dlabel'>get_target()</span></p>
<p>Returns the current visible selected target, falling back to the visible focus target.</p>
<p><b>Returns:</b> Entity object or null.</p>
<p><b>Example:</b></p>
<div class='code'>var target = get_target();</div>
