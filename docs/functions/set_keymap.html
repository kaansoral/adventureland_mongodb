<p><span class='dlabel'>set_keymap(keymap)</span></p>
<p>Replaces and saves the complete keyboard mapping object.</p>
<p><b>Returns:</b> Nothing.</p>
<p><b>Example:</b></p>
<div class='code'>set_keymap({ "1": { name: "use_hp" }, "2": { name: "use_mp" } });</div>
