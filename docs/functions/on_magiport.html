<p><span class='dlabel'>on_magiport(name)</span></p>
<p>Override point called with the mage's name when magiport consent is requested on PVE servers.</p>
<p><b>Returns:</b> Return value is ignored.</p>
<p><b>Example:</b></p>
<div class='code'>function on_magiport(name) {
	accept_magiport(name);
}</div>
