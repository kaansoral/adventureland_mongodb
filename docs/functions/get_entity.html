<p><span class='dlabel'>get_entity(id)</span></p>
<p>Looks up a visible player, monster, or citizen entity by ID.</p>
<p><b>Returns:</b> Entity object, character proxy for your own name, or undefined.</p>
<p><b>Example:</b></p>
<div class='code'>var entity = get_entity(projectile.target);</div>
