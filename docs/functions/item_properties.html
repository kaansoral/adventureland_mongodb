<p><span class='dlabel'>item_properties(item)</span></p>
<p>Calculates the effective properties of an inventory-style item object.</p>
<p><b>Returns:</b> Properties object, or null for invalid input.</p>
<p><b>Example:</b></p>
<div class='code'>show_json(item_properties(character.items[0]));</div>
