<p><span class='dlabel'>get(name)</span></p>
<p>Reads a JSON-serializable value previously stored with set for this browser profile.</p>
<p><b>Returns:</b> The parsed value, or null when no value exists or parsing fails.</p>
<p><b>Example:</b></p>
<div class='code'>var state = get("farm_state") || { kills: 0 };</div>
