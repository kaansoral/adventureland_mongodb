<p><span class='dlabel'>draw_circle(x, y, radius, size, color)</span></p>
<p>Draws a circle on the current map and tracks it for clear_drawings.</p>
<p><b>Returns:</b> PIXI.Graphics object, or undefined when graphics are disabled.</p>
<p><b>Example:</b></p>
<div class='code'>draw_circle(character.x, character.y, character.range, 2, 0x00ff00);</div>
