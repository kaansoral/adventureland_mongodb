<p><span class='dlabel'>pset(name, value)</span></p>
<p>Stores a persistent string value through the platform storage adapter.</p>
<p><b>Returns:</b> The platform storage result.</p>
<p><b>Notes:</b> Use get/set for JSON-serializable objects. pget/pset are the raw string storage pair.</p>
<p><b>Example:</b></p>
<div class='code'>pset("route", "winterland");</div>

<p></p>
<span class='redlabel'>"source"</span>
