<p><span class='dlabel'>pause()</span></p>
<p>Toggles or invokes the game's graphics pause routine.</p>
<p><b>Returns:</b> Nothing.</p>
<p><b>Notes:</b> CODE timers and the server connection are separate from graphics rendering.</p>
<p><b>Example:</b></p>
<div class='code'>pause();</div>
