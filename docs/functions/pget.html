<p><span class='dlabel'>pget(name)</span></p>
<p>Reads a persistent string value through the platform storage adapter.</p>
<p><b>Returns:</b> Stored string or platform-specific empty value.</p>
<p><b>Notes:</b> Use get/set for JSON-serializable objects. pget/pset are the raw string storage pair.</p>
<p><b>Example:</b></p>
<div class='code'>var token = pget("route");</div>
