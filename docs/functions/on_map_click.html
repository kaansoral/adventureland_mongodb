<p><span class='dlabel'>on_map_click(x, y)</span></p>
<p>Override point called with map coordinates after a map click.</p>
<p><b>Returns:</b> Return true to cancel the game's default click-to-move behavior; other returns allow it.</p>
<p><b>Example:</b></p>
<div class='code'>function on_map_click(x, y) {
	xmove(x, y);
	return true;
}</div>
