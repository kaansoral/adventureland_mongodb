<p><span class='dlabel'>get_chests()</span></p>
<p>Returns the currently visible chest collection keyed by chest ID.</p>
<p><b>Returns:</b> Object whose values are chest data.</p>
<p><b>Example:</b></p>
<div class='code'>for (var id in get_chests()) loot(id);</div>
