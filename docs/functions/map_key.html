<p><span class='dlabel'>map_key(key, skill, code)</span></p>
<p>Maps a keyboard key to a skill, built-in action, or code snippet and saves the updated keymap.</p>
<p><b>Returns:</b> Nothing.</p>
<p><b>Example:</b></p>
<div class='code'>map_key("1", "use_hp");
map_key("2", "snippet", "say('Hello')");</div>
