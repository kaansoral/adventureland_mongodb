<p><span class='dlabel'>quantity(name)</span></p>
<p>Counts the total quantity of an item key across all inventory stacks.</p>
<p><b>Returns:</b> Number; non-stackable items count as one each.</p>
<p><b>Example:</b></p>
<div class='code'>if (quantity("hpot0") &lt; 100) buy("hpot0", 100);</div>
