<p><span class='dlabel'>game_log(message, color, x)</span></p>
<p>Writes a message to the in-game log, optionally using a CSS color.</p>
<p><b>Returns:</b> Nothing.</p>
<p><b>Notes:</b> Use safe_log for text or objects supplied by another player or another untrusted source.</p>
<p><b>Example:</b></p>
<div class='code'>game_log("Ready", "#51D2E1");</div>
