<p><span class='dlabel'>can_heal(t)</span></p>
<p>Checks the normal attack-range and cooldown conditions for healing a non-monster target.</p>
<p><b>Returns:</b> Boolean.</p>
<p><b>Example:</b></p>
<div class='code'>if (can_heal(character)) heal(character);</div>
