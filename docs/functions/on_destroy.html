<p><span class='dlabel'>on_destroy()</span></p>
<p>Override point called immediately before the CODE context is destroyed.</p>
<p><b>Returns:</b> Return value is ignored.</p>
<p><b>Example:</b></p>
<div class='code'>function on_destroy() {
	clear_drawings();
	clear_buttons();
}</div>
