<p><span class='dlabel'>disconnect()</span></p>
<p>Forces the current character connection into the server's limit-disconnect path.</p>
<p><b>Returns:</b> Nothing.</p>
<p><b>Notes:</b> This deliberately disconnects the character and should not be used as an ordinary stop routine.</p>
<p><b>Example:</b></p>
<div class='code'>disconnect();</div>
