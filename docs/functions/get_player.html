<p><span class='dlabel'>get_player(name)</span></p>
<p>Looks up a visible player by character name.</p>
<p><b>Returns:</b> Character entity, your character proxy for your own name, or null.</p>
<p><b>Example:</b></p>
<div class='code'>var merchant = get_player("MerchantName");</div>
