<p><span class='dlabel'>set_message(text, color)</span></p>
<p>Sets the short CODE status message shown over the character or in CODE mode.</p>
<p><b>Returns:</b> Nothing.</p>
<p><b>Example:</b></p>
<div class='code'>set_message("Farming goo", "#51D2E1");</div>
