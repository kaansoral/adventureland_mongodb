<p><span class='dlabel'>can_use(name)</span></p>
<p>Checks class eligibility and local cooldown availability for a skill.</p>
<p><b>Returns:</b> Boolean.</p>
<p><b>Notes:</b> This is a compatibility helper. It does not replace the server's complete skill validation.</p>
<p><b>Example:</b></p>
<div class='code'>if (can_use("attack")) use_skill("attack", target);</div>
