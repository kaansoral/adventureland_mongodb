<p><span class='dlabel'>draw_line(x, y, x2, y2, size, color)</span></p>
<p>Draws a line on the current map and tracks it for clear_drawings.</p>
<p><b>Returns:</b> PIXI.Graphics object, or undefined when graphics are disabled.</p>
<p><b>Example:</b></p>
<div class='code'>draw_line(character.x, character.y, target.x, target.y, 2, 0xff8800);</div>
