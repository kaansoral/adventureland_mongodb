<p><span class='dlabel'>set_skillbar()</span></p>
<p>Replaces and saves the visible skillbar key order.</p>
<p><b>Returns:</b> Nothing.</p>
<p><b>Example:</b></p>
<div class='code'>set_skillbar("1", "2", "3", "4", "R");
set_skillbar(["1", "2", "3"]);</div>
