<p><span class='dlabel'>is_on_cooldown(skill)</span></p>
<p>Checks the local next-skill timestamp, following shared cooldown links in G.skills.</p>
<p><b>Returns:</b> Boolean.</p>
<p><b>Example:</b></p>
<div class='code'>if (!is_on_cooldown("attack")) attack(target);</div>
