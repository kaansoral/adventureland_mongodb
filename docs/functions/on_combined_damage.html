<p><span class='dlabel'>on_combined_damage()</span></p>
<p>Override point called when overlapping characters receive combined monster damage.</p>
<p><b>Returns:</b> Return value is ignored.</p>
<p><b>Example:</b></p>
<div class='code'>function on_combined_damage() {
	move(character.x + 5, character.y);
}</div>
