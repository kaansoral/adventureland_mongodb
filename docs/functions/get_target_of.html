<p><span class='dlabel'>get_target_of(entity)</span></p>
<p>Resolves the visible entity currently targeted by another entity.</p>
<p><b>Returns:</b> Entity object or null.</p>
<p><b>Example:</b></p>
<div class='code'>var victim = get_target_of(monster);</div>
