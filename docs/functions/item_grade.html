<p><span class='dlabel'>item_grade(item)</span></p>
<p>Calculates an item's grade from its definition and level.</p>
<p><b>Returns:</b> 0 for normal, 1 for high, 2 for rare, or -1 for invalid input.</p>
<p><b>Example:</b></p>
<div class='code'>var grade = item_grade(character.items[0]);</div>
