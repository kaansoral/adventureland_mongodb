<p><span class='dlabel'>add_bottom_button(id, value, fn)</span></p>
<p>Adds or updates a small CODE button below the game.</p>
<p><b>Returns:</b> Nothing. The supplied callback runs when the button is clicked.</p>
<p><b>Example:</b></p>
<div class='code'>add_bottom_button("loot", "LOOT", function () { loot(); });</div>
