<p><span class='dlabel'>is_function(f)</span></p>
<p>Checks whether a value is a callable function, including native async and generator functions.</p>
<p><b>Returns:</b> Boolean.</p>
<p><b>Example:</b></p>
<div class='code'>async function example() {
	if (is_function(callback)) await callback();
}
example();</div>
