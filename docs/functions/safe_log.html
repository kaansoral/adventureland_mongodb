<p><span class='dlabel'>safe_log(message, color)</span></p>
<p>Escapes untrusted text or JSON-serialized objects before writing them to the log.</p>
<p><b>Returns:</b> Nothing.</p>
<p><b>Example:</b></p>
<div class='code'>character.on("cm", function (data) { safe_log(data); });</div>
