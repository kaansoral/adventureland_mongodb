<p><span class='dlabel'>in_attack_range(target)</span></p>
<p>Backward-compatible range check using the character's normal attack range; it also matches priest heal range.</p>
<p><b>Returns:</b> Boolean.</p>
<p><b>Notes:</b> Prefer is_in_range(target, skill) when checking a specific skill.</p>
<p><b>Example:</b></p>
<div class='code'>if (in_attack_range(target)) attack(target);</div>
