<p><span class='dlabel'>get_active_code_slot()</span></p>
<p>Returns the code slot or file name that was active when this CODE runner started.</p>
<p><b>Returns:</b> String or slot identifier.</p>
<p><b>Example:</b></p>
<div class='code'>game_log("Running slot: " + get_active_code_slot());</div>
