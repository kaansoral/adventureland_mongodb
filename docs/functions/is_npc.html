<p><span class='dlabel'>is_npc(entity)</span></p>
<p>Checks whether an entity is an NPC.</p>
<p><b>Returns:</b> Boolean-like: true for NPCs, otherwise undefined.</p>
<p><b>Example:</b></p>
<div class='code'>if (is_npc(entity)) game_log("Found an NPC");</div>
