<p><span class='dlabel'>is_character(entity)</span></p>
<p>Checks whether an entity is a non-NPC character.</p>
<p><b>Returns:</b> Boolean-like: true for characters, otherwise undefined.</p>
<p><b>Example:</b></p>
<div class='code'>if (is_character(entity)) game_log(entity.name);</div>
