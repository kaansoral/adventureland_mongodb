<p><span class='dlabel'>get_targeted_monster()</span></p>
<p>Returns the current selected target only when it is a living monster.</p>
<p><b>Returns:</b> Monster entity or null.</p>
<p><b>Example:</b></p>
<div class='code'>var monster = get_targeted_monster();</div>
