<p><span class='dlabel'>change_target(target)</span></p>
<p>Changes the selected target and allows the normal target update to be sent to the server.</p>
<p><b>Returns:</b> The underlying target-update result, normally nothing.</p>
<p><b>Example:</b></p>
<div class='code'>change_target(get_nearest_monster({ type: "goo" }));</div>
