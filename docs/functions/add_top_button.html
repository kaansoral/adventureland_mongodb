<p><span class='dlabel'>add_top_button(id, value, fn)</span></p>
<p>Adds or updates a CODE button above the game.</p>
<p><b>Returns:</b> Nothing. The supplied callback runs when the button is clicked.</p>
<p><b>Example:</b></p>
<div class='code'>add_top_button("town", "TOWN", function () { town(); });</div>
