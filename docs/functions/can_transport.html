<p><span class='dlabel'>can_transport(entity)</span></p>
<p>Checks whether an entity is currently allowed to use a transport.</p>
<p><b>Returns:</b> Boolean.</p>
<p><b>Example:</b></p>
<div class='code'>if (can_transport(character)) transport("main", 0);</div>
