<p><span class='dlabel'>locate_item(name)</span></p>
<p>Finds the first inventory slot containing an item key.</p>
<p><b>Returns:</b> Inventory index, or -1 when not found.</p>
<p><b>Example:</b></p>
<div class='code'>var potion = locate_item("hpot0");</div>
