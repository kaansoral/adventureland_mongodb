<p><span class='dlabel'>set(name, value)</span></p>
<p>Stores a JSON-serializable value in browser-local CODE storage.</p>
<p><b>Returns:</b> true when serialization and storage succeed; false after logging a failure.</p>
<p><b>Example:</b></p>
<div class='code'>set("farm_state", { map: character.map, kills: 12 });</div>
