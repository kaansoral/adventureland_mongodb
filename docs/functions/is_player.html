<p><span class='dlabel'>is_player(e)</span></p>
<p>Backward-compatible alias for is_character.</p>
<p><b>Returns:</b> Boolean-like: true for non-NPC characters, otherwise undefined.</p>
<p><b>Example:</b></p>
<div class='code'>if (is_player(entity)) game_log(entity.name);</div>
