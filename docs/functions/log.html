<p><span class='dlabel'>log(message, color)</span></p>
<p>Writes a trusted string or JSON-serialized object to the in-game log.</p>
<p><b>Returns:</b> Nothing.</p>
<p><b>Notes:</b> Use safe_log for values supplied by other players or external sources.</p>
<p><b>Example:</b></p>
<div class='code'>log({ target: target &amp;&amp; target.id });</div>
