<p><span class='dlabel'>get_monster(id)</span></p>
<p>Looks up a visible monster by its entity ID.</p>
<p><b>Returns:</b> Monster object or null/undefined when the ID is not a visible monster.</p>
<p><b>Example:</b></p>
<div class='code'>var monster = get_monster(12345);</div>
