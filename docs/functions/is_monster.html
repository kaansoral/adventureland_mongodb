<p><span class='dlabel'>is_monster(entity)</span></p>
<p>Checks whether an entity is a monster.</p>
<p><b>Returns:</b> Boolean-like: true for monsters, otherwise undefined.</p>
<p><b>Example:</b></p>
<div class='code'>if (is_monster(entity)) attack(entity);</div>
