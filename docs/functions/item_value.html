<p><span class='dlabel'>item_value(item)</span></p>
<p>Calculates the current gold value of an inventory-style item object.</p>
<p><b>Returns:</b> Number, or 0 for invalid input.</p>
<p><b>Example:</b></p>
<div class='code'>game_log("Value: " + item_value(character.items[0]));</div>
