<p><span class='dlabel'>on_party_request(name)</span></p>
<p>Override point called when a character asks to join your existing party.</p>
<p><b>Returns:</b> Return value is ignored.</p>
<p><b>Example:</b></p>
<div class='code'>function on_party_request(name) {
	accept_party_request(name);
}</div>
