<p><span class='dlabel'>on_game_event(event)</span></p>
<p>Backward-compatible override point called for a game event announcement.</p>
<p><b>Returns:</b> Return value is ignored.</p>
<p><b>Example:</b></p>
<div class='code'>function on_game_event(event) {
	if (event.name == "goblin") smart_move("goblin");
}</div>
