<p><span class='dlabel'>is_transporting(entity)</span></p>
<p>Checks whether an entity is using town or, for your own character, another transport.</p>
<p><b>Returns:</b> Boolean.</p>
<p><b>Example:</b></p>
<div class='code'>if (!is_transporting(character)) town();</div>
