<p><span class='dlabel'>set_button_onclick(id, fn)</span></p>
<p>Replaces the click callback for an existing CODE button.</p>
<p><b>Returns:</b> Nothing.</p>
<p><b>Notes:</b> Create the button with add_top_button or add_bottom_button first.</p>
<p><b>Example:</b></p>
<div class='code'>set_button_onclick("loot", function () { loot(); });</div>
