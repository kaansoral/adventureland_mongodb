<p><span class='dlabel'>handle_death()</span></p>
<p>Backward-compatible override point called when the character dies.</p>
<p><b>Returns:</b> Return value is ignored.</p>
<p><b>Example:</b></p>
<div class='code'>function handle_death() {
	setTimeout(respawn, 15000);
}</div>
