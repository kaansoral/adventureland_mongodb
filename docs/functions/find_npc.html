<p><span class='dlabel'>find_npc(npc_id)</span></p>
<p>Finds static map coordinates for an NPC key from G.npcs.</p>
<p><b>Returns:</b> Object containing map, in, x, and y, or null when no location is found.</p>
<p><b>Example:</b></p>
<div class='code'>var potion_vendor = find_npc("fancypots");</div>
