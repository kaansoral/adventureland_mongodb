<p><span class='dlabel'>stop_character(name)</span></p>
<p>Stops another character from your account that was started with start_character().</p>
<p><b>Returns:</b> Nothing; the runner stop is requested immediately.</p>
<p><b>Example:</b></p>
<div class='code'>stop_character("Merchant");</div>
