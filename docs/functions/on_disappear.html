<p><span class='dlabel'>on_disappear(entity, data)</span></p>
<p>Override point called when a visible entity disappears, dies, or leaves view.</p>
<p><b>Returns:</b> Return value is ignored.</p>
<p><b>Example:</b></p>
<div class='code'>function on_disappear(entity, data) {
	game_log(entity.id + " disappeared");
}</div>
