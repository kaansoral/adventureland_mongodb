<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<link rel="stylesheet" href="pixel/fontfaces.83601c062a30.css">
		<script src="phrases.js"></script>
		<script src="desktop.js"></script>
		<style>
			html,body{
				background:black;
				color:white;
				margin:0 0 0 0;
				padding:0 0 0 0;
				width:100%;
				height:100%;
				overflow:hidden;
				font-family:var(--pixel-font, pixel);
				color:white;
				word-wrap:break-word;
				-webkit-font-smoothing:subpixel-antialiased;
			}
			#compatibility{
				position:fixed;
				top:20px;
				right:20px;
				display:none;
				box-sizing:border-box;
				max-width:440px;
				width:calc(100% - 40px);
				max-height:calc(100% - 40px);
				overflow:auto;
				border:5px solid gray;
				background:black;
				padding:16px;
				font-size:24px;
				line-height:28px;
				text-align:start;
				color:#C7C7C7;
				z-index:10;
			}
			#compatibility-button{
				display:block;
				width:100%;
				margin-top:14px;
				border:4px solid #5A854C;
				background:black;
				color:#85C76B;
				padding:10px 12px;
				font:inherit;
				line-height:24px;
				text-align:center;
				cursor:pointer;
			}
			#compatibility-button:hover,#compatibility-button:focus{
				border-color:#85C76B;
				outline:none;
			}
			#compatibility-button:disabled{
				border-color:gray;
				color:gray;
				cursor:default;
			}
			#compatibility-button[hidden]{display:none;}
		</style>
	</head>
	<body>
		<div id="compatibility">
			<div id="compatibility-help" role="status" aria-live="polite" dir="auto"></div>
			<button type="button" id="compatibility-button"></button>
		</div>
		<table width=100% height="100%">
			<tr>
				<td align="center">
					<div style='border: 5px solid gray;font-size: 24px;line-height: 24px;padding: 12px; display: inline-block;text-align: center; overflow-wrap: break-word; max-width: 400px'><div id='thecolor' style='color:#85C76B'>...</div> <span id="percentage">0</span>%</div>
				</td>
			</tr>
		</table>
		<script>
			var language=phrase.detect(navigator.languages || [navigator.language]);
			var compatibility_started=false,compatibility_active=false,long_wait=false,compatibility_failed=false;
			function show_connection_help(){
				var retry=compatibility_active && long_wait;
				document.getElementById('compatibility-help').textContent=phrase(compatibility_failed?'desktop.connection_help':retry?'desktop.compatibility_retry':'desktop.compatibility_help');
				var button=document.getElementById('compatibility-button');
				button.hidden=retry || compatibility_failed;
				button.disabled=compatibility_started;
				button.textContent=phrase(compatibility_started?'desktop.loading':'desktop.compatibility_yes');
			}
			function use_compatibility(){
				if(compatibility_started) return;
				compatibility_started=true;
				show_connection_help();
				desktop.compatibility().then(function(){
					compatibility_active=true;
					show_connection_help();
				}).catch(function(error){
					// Do not retry a timed-out command: it may still reach the native UI.
					compatibility_failed=true;
					show_connection_help();
					console.error('[Tauri] Compatibility mode failed:',error);
				});
			}
			document.getElementById('compatibility-button').addEventListener('click',use_compatibility);
			function show_language(language){
				document.documentElement.lang=language;
				var language_script=document.createElement('script');
				language_script.src='languages/'+language+'.js';
				language_script.onload=function(){
					document.getElementById('thecolor').textContent=phrase('desktop.loading');
					show_connection_help();
				};
				document.head.appendChild(language_script);
				return new Promise(function(resolve){language_script.addEventListener('load',resolve);language_script.addEventListener('error',resolve);});
			}
			// Start in the system language immediately. Steam/cache resolution is optional.
			var initial_language=show_language(language);
			desktop.language().then(function(selected){
				if(selected && selected!==language) initial_language.then(function(){show_language(selected);});
			});
			var progress=0,s9=0,percent=0;
			setInterval(function(){
				progress+=1;
				if(progress<=99)
					document.getElementById("percentage").innerHTML=progress;
				else
				{
					percent+=1;
					if(percent==10) percent=0,s9++;
					if(s9>=480)
					{
						s9=480; if(!percent) percent=1;
					}
					var dot=".";
					for(var i=0;i<s9;i++) dot+="9";
					if(percent) dot+=percent;
					document.getElementById("percentage").innerHTML="99"+dot;
				}
			},10);
			setTimeout(function(){
				document.getElementById('compatibility').style.display='block';
				document.getElementById('thecolor').style.color='#D38639';
			},30000);
			setTimeout(function(){
				long_wait=true;
				show_connection_help();
			},60000);
		</script>
	</body>
</html>
